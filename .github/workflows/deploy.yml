name: Verify and deploy Alamino

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DATABASE_PATH: ${{ runner.temp }}/alamino-ci/app.db
      AI_API_KEY: ''
      PAYPAL_CLIENT_ID: ''
      PAYPAL_CLIENT_SECRET: ''
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Validate deployment files
        run: |
          for script in deploy/release.sh deploy/github-deploy.sh; do bash -n "$script"; done
          node --test deploy/tests/*.test.cjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preproduction
    concurrency:
      group: alamino-live-preprod-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy the verified commit and check HTTPS
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/github-deploy.sh
