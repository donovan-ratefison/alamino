<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alamino Demo Stage v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0070e0; --brand:#003087; --ink:#052969; --soft:#eff6ff; --line:#dce5f2;
  --muted:#5b6b86; --paid:#16a34a; --paypal:#ffc439;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#070d1a;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}

/* Controls (outside the video frame) */
#ctrl{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#0b1428;border-bottom:1px solid #1b2a4a;z-index:10;overflow-x:auto}
#ctrl button{border:1px solid #2a3b60;background:#12203d;color:#dbe7ff;border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
#ctrl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#ctrl .hint{color:#7f93b8;font-size:12px;margin-left:auto;white-space:nowrap}
body.clean #ctrl{display:none}

/* 1920 x 1080 frame, scaled to the window. #cam holds the content. It never moves: focus() lifts one block instead. */
#frame{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--soft)}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
.notrans,.notrans *{transition:none!important}
#stage{position:absolute;inset:0 0 auto 0;height:660px;
  background:radial-gradient(1100px 620px at 50% 25%,#0d4aa8 0%,#063585 45%,#041f55 100%)}
#stage::after{content:"";position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(transparent,rgba(2,12,40,.45))}
#progress{position:absolute;left:0;top:0;height:4px;background:var(--paypal);z-index:20;width:0}

/* Phone: inner screen 270 x 614, a 30px notch strip on top of a 270 x 584 video area (390:844, the clip ratio) */
#phone{position:absolute;left:60px;top:14px;width:290px;height:634px;border-radius:46px;border:10px solid var(--pc,#003087);
  background:#fff;overflow:hidden;z-index:2;transition:border-color .6s,box-shadow .6s,opacity .6s,transform .6s;
  box-shadow:0 0 0 2px rgba(255,255,255,.15),0 40px 90px -20px var(--pc,#003087)}
.notch{position:absolute;left:50%;top:6px;width:84px;height:20px;margin-left:-42px;background:#0b1220;border-radius:12px;z-index:5}
.pstatus{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:11px;font-weight:600}
.phead{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.phead img{height:20px}
.phead .who{font-size:12px;font-weight:600;color:#fff;background:var(--pc,#003087);padding:4px 10px;border-radius:999px;transition:background .6s}
/* Placeholder screen when a clip file is missing: a title and two skeleton cards */
.skt{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px}
.sk{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.sk .shim{display:block}
#pscreen{position:absolute;left:0;right:0;top:86px;bottom:0;padding:16px}
#pscreen.swap{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* The video starts under the notch strip, so the notch never hides the app header. */
.pvid{position:absolute;left:0;right:0;top:30px;bottom:0;width:100%;height:calc(100% - 30px);object-fit:contain;object-position:top;background:#fff;z-index:3;display:none}
.pvid.on{display:block}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(0,112,224,.35);border:2px solid rgba(255,255,255,.9);z-index:6;pointer-events:none;animation:tap .6s ease-out forwards}
@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
#ptoast{position:absolute;left:14px;right:14px;bottom:26px;z-index:6;border-radius:14px;padding:12px 14px;background:#0b2a6f;color:#fff;font-size:13px;font-weight:600;line-height:1.35;
  opacity:0;transform:translateY(16px);transition:opacity .35s,transform .35s}
#ptoast.on{opacity:1;transform:none}
#pnotif{position:absolute;left:10px;right:10px;top:34px;z-index:6;border-radius:16px;background:#0b2a6f;color:#fff;padding:12px 14px;font-size:14px;
  opacity:0;transform:translateY(-40px);transition:opacity .4s,transform .6s cubic-bezier(.2,.9,.3,1.2)}
#pnotif.on{opacity:1;transform:none}
#pnotif small{display:block;color:var(--paypal);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);height:18px}
.thumb{display:block;width:238px;height:165px;object-fit:cover;border-radius:12px;margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff}
.tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--soft);border-radius:999px;padding:3px 9px;display:inline-block;margin-bottom:6px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #eef2f8}
.row:last-child{border-bottom:0}
.row span{color:var(--muted)}
.row.total b{color:var(--paid);font-size:16px}
.btn{display:block;width:100%;margin-top:12px;border:0;border-radius:999px;padding:12px;background:var(--pc,#003087);color:#fff;font-weight:600;font-size:15px;position:relative;overflow:hidden}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.paypal{background:var(--paypal);color:#0b2a6f}
.btn.press{animation:press .35s ease}
.btn.press::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:rgba(255,255,255,.6);animation:ripple .5s ease-out forwards}
@keyframes press{50%{transform:scale(.95)}}
@keyframes ripple{to{transform:scale(18);opacity:0}}
.ok{margin-top:12px;border-radius:14px;padding:12px;background:#e8f7ee;color:#11632f;font-weight:600;font-size:14px;animation:fadein .4s ease}
.amt{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.muted{font-size:13px;color:var(--muted);line-height:1.4}
.fine{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
.center{text-align:center}
.idle{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.idle img{width:190px}
.cam{position:absolute;inset:0;background:#0b1220;color:#cbd5e1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:13px}
.cam .vf{width:220px;height:150px;border:2px dashed rgba(255,255,255,.35);border-radius:12px}
.cam .shutter{position:absolute;bottom:28px;width:62px;height:62px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.2)}
.ai{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);margin:4px 0 12px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shim{height:12px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,#eef3fb 25%,#dbe7f8 50%,#eef3fb 75%);background-size:300% 100%;animation:shim 1.2s linear infinite}
.shim.short{width:60%}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}

/* Laptop (inner 1032 x 552) */
#laptop{position:absolute;left:600px;top:24px;width:1060px;height:580px;border:14px solid #0f172a;border-radius:20px;background:#fff;overflow:hidden;z-index:2;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7);transition:box-shadow .6s,opacity .6s,transform .6s}
#laptop.live{box-shadow:0 0 0 3px var(--accent),0 40px 100px -20px #3b9bff}
#base{position:absolute;left:570px;top:600px;width:1120px;height:24px;border-radius:0 0 22px 22px;background:linear-gradient(#d5dde9,#97a6bd);z-index:2;transition:opacity .6s}
#base::before{content:"";position:absolute;left:50%;top:0;width:150px;height:8px;margin-left:-75px;border-radius:0 0 10px 10px;background:#8494ad}
.ltop{height:46px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line)}
.ltop img{height:22px}
.ltop .sep{width:1px;height:20px;background:var(--line)}
.ltop .t{font-weight:600;font-size:14px}
.ltop .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.ltop .live i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.lbody{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:78px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:background .5s,border-color .5s}
.kpi span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-size:28px;letter-spacing:-.02em;margin-top:4px}
.kpi.hot{background:var(--soft);border-color:#9cc7f5}
.lmain{display:grid;grid-template-columns:580px 1fr;gap:14px;margin-top:12px;height:388px}
.box{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.bhead{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.bhead small{font-weight:500;color:var(--muted);font-size:12px}
.lbtn{margin-left:auto;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;position:relative;overflow:hidden}
.lbtn[disabled]{background:#c7d3e6;cursor:default}
.lbtn.press{animation:press .35s ease}
#pbody{flex:1;overflow:hidden}
.empty{padding:40px 16px;text-align:center;font-size:14px;color:var(--muted)}
.bfoot{height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:4px;background:#e8eef7;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--paid);transition:width .9s ease}
#feed{list-style:none;padding:6px 14px;overflow:hidden;flex:1}
#feed li{display:grid;grid-template-columns:44px 1fr;gap:6px;font-size:12.5px;line-height:1.4;padding:9px 0;border-bottom:1px solid #eef2f8;animation:fadein .5s ease}
#feed time{color:var(--muted);font-variant-numeric:tabular-nums}

/* Clearing round panel */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{height:25px;padding:0 14px;text-align:left;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl .pill{padding:1px 8px;font-size:11px}
.tbl td{height:24px;padding:0 14px;border-bottom:1px solid #eef2f8}
.tbl td:nth-child(3){font-weight:600;font-variant-numeric:tabular-nums}
.tbl tr.fresh{animation:fadein .5s ease;background:#f5f9ff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;transition:background .4s,color .4s}
.pill.ok{background:#e8f7ee;color:#11632f}
.pill.wait{background:#fff4dc;color:#8a5a00}
.pill.done{background:#11632f;color:#fff}
.crow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #eef2f8;animation:fadein .5s ease}
.crow div{flex:1}
.crow b{font-size:14px}
.crow p{font-size:12.5px;color:var(--muted);margin-top:3px}
.crow em{font-style:normal;font-weight:700;color:var(--accent);font-size:14px}
.prow{display:grid;grid-template-columns:150px 1fr 90px 100px;align-items:center;height:56px;padding:0 16px;border-bottom:1px solid #eef2f8;font-size:14px;animation:fadein .5s ease both}
.prow b{font-size:17px;font-variant-numeric:tabular-nums}
.prow .act{color:var(--muted)}
.prow .pill{justify-self:end}

/* Photo capture overlay */
#shot{position:absolute;left:620px;top:96px;width:720px;height:480px;z-index:5;opacity:0;transform-origin:0 0;transform:scale(.94);pointer-events:none;
  transition:opacity .5s,transform .5s ease}
#shot img{width:100%;height:100%;object-fit:cover;border-radius:22px;box-shadow:0 40px 120px rgba(0,0,0,.6)}
#shot .vf{position:absolute;inset:32px;border:0}
#shot .vf i{position:absolute;width:48px;height:48px;border:4px solid #fff}
#shot .vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
#shot .vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#shot .vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
#shot .vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#shot.show{opacity:1;transform:none}
#shot.fly{transition:transform .7s cubic-bezier(.6,0,.3,1),opacity .3s .6s}
#shot.fly .vf{display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:10;pointer-events:none}
#flash.on{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

/* Overlays: badge, speech bubble, coins, subtitles */
#bubble{position:absolute;z-index:6;max-width:230px;padding:10px 16px;border-radius:18px;background:#fff;color:var(--ink);font-size:18px;font-weight:600;line-height:1.3;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.5);opacity:0;transform:scale(.9);transform-origin:20% 100%;transition:opacity .3s,transform .3s}
#bubble::after{content:"";position:absolute;bottom:-9px;left:60px;width:18px;height:18px;background:#fff;transform:rotate(45deg)}
#bubble.r{transform-origin:80% 100%}
#bubble.r::after{left:auto;right:60px}
#bubble.on{opacity:1;transform:none}
.coin{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--paypal);border:2px solid #e0a800;color:#7a5200;
  font:700 16px/26px Inter,system-ui,sans-serif;text-align:center;z-index:9;pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.25)}
/* Fixed over the laptop (x 590 to 1690), so it never covers the phone or the people */
#sub{position:absolute;left:590px;right:230px;margin:0 auto;width:max-content;top:590px;z-index:40;max-width:1100px;padding:11px 26px;border-radius:999px;background:rgba(5,15,40,.88);color:#fff;
  font-size:25px;font-weight:500;line-height:1.3;text-align:center;opacity:0;transition:opacity .4s}
#sub.on{opacity:1}

/* Title and end cards */
.card-over{position:absolute;inset:0 0 auto 0;height:660px;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;color:#fff;
  background:radial-gradient(900px 500px at 50% 45%,#0a3f9a,#031a45);opacity:0;pointer-events:none;transition:opacity .8s}
/* The hook card covers the whole frame: the bottom band stays hidden until the market appears. */
#titlecard{height:1080px;z-index:30}
.card-over.on{opacity:1}
.card-over .k{font-size:22px;color:#9cc7f5;letter-spacing:.02em}
.card-over h1{font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1.08;max-width:1500px}
.card-over h1 em{font-style:normal;color:var(--paypal)}
.card-over p{font-size:26px;color:#cfe0fb;max-width:1100px}
.card-over .stats{display:flex;gap:56px}
.card-over .stats div{font-size:18px;color:#9cc7f5}
.card-over .stats b{display:block;font-size:46px;color:#fff;letter-spacing:-.02em}

/* Bottom region: caption, market, Finance desk */
#bottom{position:absolute;inset:660px 0 0 0;background:var(--soft);border-top:1px solid var(--line)}
#caption{position:absolute;left:40px;top:24px;width:470px;height:372px;display:flex;flex-direction:column}
#caption img{height:30px;align-self:flex-start;margin-bottom:20px}
#caption .step{font-size:15px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
#caption h2{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.12;margin:10px 0 12px}
#caption p{font-size:19px;line-height:1.45;color:var(--muted)}
#caption.swap > *:not(img){animation:fadein .5s ease both}
#dots{display:flex;gap:8px;margin-top:auto}
#dots i{width:30px;height:5px;border-radius:3px;background:#c9d8ee;transition:background .4s}
#dots i.on{background:var(--accent)}
#ellfill{fill:rgba(255,255,255,.55)}
#ellipse{fill:none;stroke:#b9cbe6;stroke-width:2;stroke-dasharray:6 7;transition:stroke .6s,filter .6s}
#market{transition:opacity .6s}

/* Market drawing */
#market{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:3;pointer-events:none;overflow:visible}
#market text{font-family:Inter,system-ui,sans-serif;text-anchor:middle}
.mlabel{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#7f93b8}
.edge{opacity:0;transition:opacity .5s}
.edge path{fill:none;stroke:#94a3b8;stroke-width:2.6;marker-end:url(#m-grey);stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s ease,stroke .3s}
.edge text{font-size:15px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--soft);stroke-width:5px;transition:fill .3s}
.edge.on{opacity:1}
.edge.on path{stroke-dashoffset:0}
.edge.dash path{stroke:var(--accent);stroke-dasharray:.018 .012;marker-end:url(#m-blue)}
.edge.dash text{fill:var(--accent)}
.edge.lit path{stroke:var(--accent);marker-end:url(#m-blue);animation:pulse .45s ease-in-out infinite alternate}
.edge.lit text{fill:var(--accent);font-size:18px}
@keyframes pulse{to{stroke-width:5.5}}
.edge.on.zero{opacity:0}
#market.hub .edge{opacity:0}
.hubedge,.hubnode{opacity:0;transition:opacity .6s}
#market.hub .hubedge,#market.hub .hubnode{opacity:1}
.hubedge path{fill:none;stroke:var(--accent);stroke-width:3.2;marker-end:url(#m-blue);stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease,stroke .5s}
#market.hub .hubedge path{stroke-dashoffset:0}
.hubedge text{font-size:16px;font-weight:700;fill:var(--accent);paint-order:stroke;stroke:var(--soft);stroke-width:5px;transition:fill .5s}
.hubedge.paid path{stroke:var(--paid);marker-end:url(#m-green)}
.hubedge.paid text{fill:var(--paid)}
.hubnode rect{fill:var(--brand)}
.hubnode text{font-size:14px;font-weight:600;fill:#fff}
.node .ring{fill:rgba(255,255,255,.7);stroke-width:2.2;stroke-dasharray:6 5;opacity:0;transition:opacity .4s}
.node .in{font-size:15px;font-weight:700;opacity:0;transition:opacity .4s}
.node .lab,.node .prof{paint-order:stroke;stroke:var(--soft);stroke-width:5px;transition:opacity .4s}
.node .lab{font-size:15px;font-weight:700}
.node .prof{font-size:12.5px;font-weight:500;fill:var(--muted)}
.node.away .ring,.node.away .in{opacity:1}
.node.away .lab,.node.away .prof{opacity:0}
.node.ops .lab{font-size:14px;font-weight:600;fill:var(--muted)}

/* Characters */
.fig{position:absolute;left:0;top:0;width:120px;height:140px;transform-origin:60px 140px;z-index:4;
  transition:transform .8s cubic-bezier(.65,0,.35,1),opacity .6s}
.fig svg{width:100%;height:100%;overflow:visible}
.fig.act svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Focus: one block glows and lifts a little, the two others dim */
/* Devices on the dark stage dim with brightness (opacity washes them out); the market on the light band uses opacity. */
#phone,#laptop,#base{transition:filter .6s,transform .6s,border-color .6s,box-shadow .6s,opacity .6s}
#cam[data-focus] :is(#phone,#laptop,#base){filter:brightness(.5) saturate(.8)}
#cam[data-focus] #market{opacity:.6}
#cam[data-focus=phone] #phone,#cam[data-focus=laptop] :is(#laptop,#base){filter:none}
#cam[data-focus=market] #market{opacity:1}
#cam[data-focus=phone] #phone{transform:scale(1.03);box-shadow:0 0 0 2px rgba(255,255,255,.15),0 0 0 7px rgba(0,112,224,.5),0 0 70px 6px rgba(59,155,255,.55)}
#cam[data-focus=laptop] #laptop{transform:scale(1.03);box-shadow:0 0 0 4px var(--accent),0 0 80px 6px rgba(59,155,255,.6)}
#cam[data-focus=market] #ellipse{stroke:#7fb3ec;filter:drop-shadow(0 0 16px rgba(0,112,224,.35))}

/* Name tag under a person at the phone or the laptop */
.ntag{position:absolute;top:648px;z-index:5;padding:5px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px -8px rgba(0,0,0,.4);
  font-size:15px;white-space:nowrap;color:var(--muted);opacity:0;transition:opacity .4s}
.ntag b{color:var(--ink)}
.ntag.on{opacity:1}
#tag-t{left:470px;transform:translateX(-50%)}
#tag-o{right:20px}

/* Approved badge above a trader in the market */
.okb{position:absolute;z-index:5;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:999px;background:var(--paid);color:#fff;font-size:13px;font-weight:600;
  transform:translate(-50%,-100%) scale(.8);opacity:0;transition:opacity .3s,transform .3s}
.okb svg{width:14px;height:14px}
.okb.on{opacity:1;transform:translate(-50%,-100%)}

/* Between two traders the phone slides out to the left and back in. Soa's desk slides in the same way. */
#phone{transition:filter .6s,transform .45s ease-out,border-color .6s,box-shadow .6s,opacity .45s ease-out}
#phone.out{transform:translateX(-460px);opacity:0;transition-timing-function:ease-in}
#desk{position:absolute;left:8px;top:24px;width:572px;height:406px;z-index:3;transform:translateX(-620px);opacity:0;pointer-events:none;
  transition:transform .45s ease-in,opacity .45s ease-in}
#desk.on{transform:none;opacity:1;transition-timing-function:ease-out}
#desk .chip{position:absolute;left:50%;top:0;transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:#fff;color:var(--ink);font-size:15px;font-weight:600;white-space:nowrap;
  box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
#dscreen{position:absolute;left:12px;top:42px;width:548px;height:350px;border:10px solid var(--dc,#e11d48);border-radius:14px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.15),0 30px 80px -16px var(--dc,#e11d48)}
#dbase{position:absolute;left:0;top:392px;width:572px;height:14px;border-radius:0 0 14px 14px;background:linear-gradient(#d5dde9,#97a6bd)}
#dbase::before{content:"";position:absolute;left:50%;top:0;width:90px;height:5px;margin-left:-45px;border-radius:0 0 6px 6px;background:#8494ad}
.dvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;z-index:2;display:none}
.dvid.on{display:block}

/* S02 Team: full-frame card */
#teamp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-bottom:90px;text-align:center}
#teamp .logo-tile{padding:14px 26px}
#teamp .logo-tile img{height:44px}
#teamp .k{font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--paypal)}
#teamp .people{margin-top:30px}
#teamp .pcol b{color:#fff;font-size:34px}
#teamp .pcol span{color:#9cc7f5;font-size:18px}
#teamp .pcol svg{width:18px;height:18px}
/* Team columns (team card and end card): 3 equal columns, one after the other */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;width:1020px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transform:translateY(10px);
  transition:opacity .6s,transform .6s;transition-delay:calc(var(--d,0s) + var(--i)*.25s)}
.pcol b{font-size:28px;font-weight:600;letter-spacing:-.01em}
.pcol span{display:flex;align-items:center;gap:7px;font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:nowrap}
.pcol svg{width:16px;height:16px;flex:none}
#teamp.show .pcol,#endp.on .pcol{opacity:1;transform:none}
#endp .pcol b{color:#fff;font-size:26px}
#endp .pcol span{color:#9cc7f5}
#endp .people{--d:1.6s}

/* Full-frame scenes (S00, S02, S11 to S13): a dark-blue backdrop over everything */
#full{position:absolute;inset:0;z-index:12;color:#fff;opacity:0;pointer-events:none;transition:opacity .8s;
  background:radial-gradient(1400px 800px at 50% 35%,#0b3a86 0%,#062456 55%,#031331 100%)}
#full.on{opacity:1}
.panel{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.panel.on{opacity:1}
body.full #sub,body.centred #sub{left:0;right:0}
body.full #sub{top:972px;max-width:1500px}

/* S11 Architecture */
#arch h2{position:absolute;left:0;right:0;top:48px;text-align:center;font-size:46px;font-weight:600;letter-spacing:-.02em}
.lane{position:absolute;left:60px;width:1800px;height:176px;border-radius:24px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);
  background:color-mix(in srgb,var(--c) 6%,transparent);opacity:.35;transition:opacity .6s,background .6s,border-color .6s,box-shadow .6s}
.lane.on{opacity:1;background:color-mix(in srgb,var(--c) 13%,transparent);border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 40px -10px var(--c)}
.lhead{position:absolute;left:24px;top:26px;width:320px;display:grid;grid-template-columns:56px 1fr;gap:6px 16px;align-items:start}
.lhead .ic{grid-row:span 2;width:56px;height:56px;border-radius:16px;background:var(--c);display:flex;align-items:center;justify-content:center}
.lhead .ic svg,.lhead .ic img{width:30px;height:30px}
.lhead .ic img{filter:brightness(0) invert(1)}
.lane.pp .ic{background:linear-gradient(135deg,#003087,#009cde)}
.lhead b{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.lhead p{font-size:15px;line-height:1.4;color:#c9d8f2}
.lock{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:#fff;color:#5b21b6;font-size:12px;font-weight:700;
  opacity:0;transform:scale(.6);transition:opacity .4s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.lock svg{width:12px;height:12px}
.lock.on{opacity:1;transform:none}
#wires{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.wire{fill:none;stroke:rgba(255,255,255,.18);stroke-width:2;stroke-dasharray:5 7}
.trail{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px currentColor)}
#dot{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:#fff;opacity:0;
  box-shadow:0 0 0 4px rgba(255,255,255,.25),0 0 26px 10px var(--dc,#9cc7f5)}
.st{position:absolute;width:140px;height:70px;display:flex;align-items:center;justify-content:center;padding:0 12px;border-radius:14px;text-align:center;
  font-size:14.5px;font-weight:600;line-height:1.25;color:#e6eefc;background:#0d2c63;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  opacity:.4;transition:opacity .5s,background .4s,box-shadow .4s,border-color .4s}
.st i{position:absolute;left:9px;top:6px;font-style:normal;font-size:11px;opacity:.7}
.st.on{opacity:1}
.st.lit{background:color-mix(in srgb,var(--c) 32%,#0a2a5e);border-color:var(--c);box-shadow:0 0 28px -2px var(--c);color:#fff}
#arch.all .st{box-shadow:0 0 34px 0 var(--c)}

/* S12 Proof */
#proof{display:flex;flex-direction:column;align-items:center;padding-top:96px}
#pnum{font-size:150px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--paypal);font-variant-numeric:tabular-nums}
#proof h2{font-size:54px;font-weight:600;letter-spacing:-.02em;margin-top:22px;opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s}
#proof h2 em{font-style:normal;color:var(--paypal)}
#proof.done h2{opacity:1;transform:none}
#tiles{display:grid;grid-auto-flow:column;grid-auto-columns:300px;justify-content:center;gap:28px;margin-top:70px}
.tile{height:230px;border-radius:22px;padding:28px 26px;background:rgba(255,255,255,.07);border:1px solid rgba(156,199,245,.3);
  opacity:0;transform:translateY(24px) scale(.96);transition:opacity .6s,transform .6s cubic-bezier(.2,.9,.3,1.2)}
.tile.on{opacity:1;transform:none}
.tile b{display:block;font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.tile span{display:block;margin-top:14px;font-size:19px;line-height:1.4;color:#c9d8f2}

/* S00 Opening */
#openp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding-bottom:70px}
#openp .logo-tile{opacity:0;transform:translateY(34px);transition:opacity 1s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
#openp.rise .logo-tile{opacity:1;transform:none}
#openp h1{font-size:76px;font-weight:600;letter-spacing:-.03em;opacity:0;transform:translateY(16px);transition:opacity .8s,transform .8s}
#openp.show h1{opacity:1;transform:none}
#openp h1 em,#endp h2 em,.card-over h1 em{font-style:normal;color:var(--paypal)}

/* S13 End */
#endp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding-bottom:80px;text-align:center}
#endp > :not(.people){opacity:0;transform:translateY(14px);transition:opacity 1.2s,transform 1.2s}
#endp.on > :not(.people){opacity:1;transform:none}
#endp.on > :nth-child(2){transition-delay:.5s}
#endp.on > :nth-child(3){transition-delay:1s}
#endp.on > :nth-child(4){transition-delay:1.25s}
#endp.on > :nth-child(6){transition-delay:2.4s}
.logo-tile{padding:22px 40px;border-radius:24px;background:#fff}
.logo-tile img{height:72px;display:block}
#endp h2{font-size:46px;font-weight:600;letter-spacing:-.02em}
.lnk{display:flex;align-items:center;gap:12px;font:500 26px ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe0fb}
.lnk svg{width:26px;height:26px;flex:none;color:#fff}
.lnk b{font:600 26px Inter,system-ui,sans-serif;color:#fff}
#endp .hk{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--paypal)}

/* S03 Problem: no market in the bottom band, the devices dim */
body.problem :is(#market,.fig,.okb,.ntag){opacity:0}
body.problem :is(#phone,#laptop,#base){opacity:.45}
/* S05 The week: the clearing house laptop dims under the typing card */
#cam.typing :is(#laptop,#base){filter:brightness(.5) saturate(.8)}

/* Typing card (S05): the sentence, the AI draft lines, then Saved */
#tcard{position:absolute;left:600px;top:96px;width:520px;z-index:6;padding:22px 26px 24px 28px;border-radius:20px;background:#fff;color:var(--ink);
  border-left:6px solid var(--tc,#0070e0);box-shadow:0 24px 60px -18px rgba(0,0,0,.55);font-size:22px;line-height:1.4;
  opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
#tcard.on{opacity:1;transform:none}
#tcard .tw{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
#tcard .tw span{color:var(--muted);font-weight:600}
#tcard .caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-3px;background:var(--ink);animation:blink 1s steps(1) infinite}
#tcard.ready .caret,#tcard.short .caret{display:none}
@keyframes blink{50%{opacity:0}}
#tcard .tai{display:none;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7c3aed}
#tcard .tai svg{width:16px;height:16px}
#tcard.ready .tai{display:flex}
.tdraft{font-size:20px;padding:8px 0;border-top:1px solid #eef2f8;animation:fadein .35s ease both}
#tcard .tsaved{display:none;align-items:center;gap:6px;margin-top:12px;padding:5px 12px;border-radius:999px;background:#e8f7ee;color:#11632f;font-size:15px;font-weight:700;width:max-content}
#tcard .tsaved svg{width:14px;height:14px}
#tcard.saved .tsaved{display:flex;animation:fadein .35s ease both}

/* Desk placeholder: the same app screen in a wide layout */
.dmock{position:absolute;inset:0;background:#fff}
.dtop{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
.dtop img{height:20px}
.dtop .who{font-size:12px;font-weight:600;color:#fff;background:var(--dc,#e11d48);padding:4px 10px;border-radius:999px}
.dbody{padding:16px 18px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
</style>
</head>

<script>
// Rename here. The phone clips are real recordings and keep the app's names.
// Every visible text of the video is built from CONFIG, so one change here changes the whole video.
const CONFIG = {
  hackathon: 'PayPal AI Hackathon 2026',
  tagline: 'Cancel the circle. Pay the rest.',
  hookLine: 'Banks clear what they owe each other every day. Small businesses never could.',
  // The part of each line that shows in PayPal yellow
  highlight: {tagline:'Pay the rest.', hookLine:'never could'},
  repo: 'https://github.com/donovan-ratefison/alamino',
  demo: 'https://alamino.live-preprod.site/',
  team: [{name:'Donovan Ratefison', github:'donovan-ratefison'}, {name:'Tendry Tsilavina', github:'TsilavinaZh'}, {name:'Tokiarivelo', github:'Tokiarivelo'}],
  // Kept for a local version of the video. No visible text uses it now.
  place: {city:'Antananarivo', clearing:'BFM', banks:'Malagasy banks'},
  people: {
    hery:  {name:'Hery',  job:'Rice wholesaler'},
    soa:   {name:'Soa',   job:'Restaurant owner'},
    rivo:  {name:'Rivo',  job:'Butcher'},
    lalao: {name:'Lalao', job:'Vegetable seller'},
    fidy:  {name:'Fidy',  job:'Delivery driver'},
    ops:   {name:'Finance desk', job:'Clearing house operator'},
  },
  PROOF: [
    {value:'$570',  label:'cancelled in circles, no cash'},
    {value:'67.7%', label:'less cash moved'},
    {value:'9 → 5', label:'9 debts settled with 5 PayPal transfers: 3 payments in, 2 payouts'},
    {value:'0',     label:'amounts set by the AI. Every number comes from plain code.'},
  ],
};

// Clips: real screen recordings. Phone clips are 390 x 844, the desk clip is 1280 x 800. Times in seconds from the clip start.
// taps: [time, x %, y %] tap ripples over the video. saved: the app shows "Saved". paid: PayPal confirms the payment.
// toast: [time, text] and notif: [time, title, text] are optional overlays on the phone.
// Week clips (typing card): text is the sentence typed in the clip. type: [start, end] of the typing. ready: the AI draft shows.
// short: true shows the whole sentence at the clip start (no typewriter).
const CLIPS = {
  soaDesk:       { src:'demo-v3/soa-desk.mp4', dur:7.16, saved:6.56, taps:[[3.41,12,53.9], [6.52,89.5,72.3]], desk:true,
                   type:[0.57,3.34], ready:4.41, text:'I owe Hery 300 for rice. Fidy owes me 90 for lunches, and Lalao owes me 150 for catering.' },
  fidyText:      { src:'demo-v3/fidy-text.mp4', dur:5.46, saved:4.86, taps:[[0.44,72.9,37.8], [1.67,28.2,76], [4.8,78.2,53.1]],
                   type:[0.63,1.6], ready:2.67, text:'Hery owes me 120 for the deliveries' },
  rivoText:      { src:'demo-v3/rivo-text.mp4', dur:4.47, saved:3.87, taps:[[0.43,72.9,37.8], [1.67,28.2,76], [3.81,76.8,64.2]],
                   short:true, ready:2.57, text:'Soa owes me 110 for zebu meat, Fidy 40 for meat' },
  lalaoText:     { src:'demo-v3/lalao-text.mp4', dur:4.51, saved:3.91, taps:[[0.42,72.9,37.8], [1.74,28.2,76], [3.88,76.8,64.2]],
                   short:true, ready:2.64, text:'Rivo owes me 70 for onions. I owe Hery 60 for rice' },
  rivoAdd:       { src:'demo-v3/rivo-add.mp4', dur:4.11, saved:3.51, taps:[[3.46,78.2,67.8]] },
  heryConfirm:  { src:'demo-v3/hery-confirm.mp4',  dur:5.0, taps:[[2.2, 29.7, 43.6]] },
  soaPay:       { src:'demo-v3/soa-pay.mp4',       dur:8.0, paid:6.4, taps:[[1.15, 50, 56]] },
  lalaoPay:     { src:'demo-v3/lalao-pay.mp4',     dur:3.5, paid:2.3, taps:[[0.95, 50, 56]] },
  fidyPay:      { src:'demo-v3/fidy-pay.mp4',      dur:3.5, paid:2.3, taps:[[0.95, 50, 56]] },
  heryStatement:{ src:'demo-v3/hery-statement.mp4',dur:5.0, taps:[] },
};
// Fallback when a clip file does not load: mock screens. screens: [clip time, screen, arg]. ok: text after a tap.
const MOCK = {
  soaDesk:      { who:'soa',   screens:[[0,'skel','Add a debt']] },  // desk: #dmock shows instead
  fidyText:     { who:'fidy',  screens:[[0,'skel','Add a debt']] },
  rivoText:     { who:'rivo',  screens:[[0,'skel','Add a debt']] },
  lalaoText:    { who:'lalao', screens:[[0,'skel','Add a debt']] },
  rivoAdd:      { who:'rivo',  screens:[[0,'reading'],[1.9,'draft']], ok:'Saved.' },
  heryConfirm:  { who:'hery',  screens:[[0,'confirm']], ok:'Confirmed by both sides.' },
  soaPay:       { who:'soa',   screens:[[0,'skel','Payments']] },
  lalaoPay:     { who:'lalao', screens:[[0,'skel','Payments']] },
  fidyPay:      { who:'fidy',  screens:[[0,'skel','Payments']] },
  heryStatement:{ who:'hery',  screens:[[0,'payout']] },
};

/* Sound: Web Audio only. The context starts on the first click or key press. */
let ctx=null, master=null, soundOn=true, padAt=0, padI=0;
function audio(){
  if(!ctx){ ctx=new AudioContext(); master=ctx.createGain(); master.gain.value=soundOn?1:0; master.connect(ctx.destination); }
  if(playing) ctx.resume();
}
function tone(f, at, dur, type, g, f2){
  if(!ctx) return;
  const o=ctx.createOscillator(), v=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,at);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, at+dur);
  v.gain.setValueAtTime(g,at); v.gain.exponentialRampToValueAtTime(.0001, at+dur);
  o.connect(v).connect(master); o.start(at); o.stop(at+dur+.05);
}
const sfx = {
  tap(){ if(ctx) tone(900, ctx.currentTime, .07, 'sine', .12, 520); },
  tick(){ if(ctx) tone(1480, ctx.currentTime, .08, 'sine', .05, 1180); },
  chime(){ if(!ctx) return; const n=ctx.currentTime; tone(880,n,.5,'triangle',.14); tone(1318.5,n+.13,.8,'triangle',.14); },
  approve(){ if(!ctx) return; const n=ctx.currentTime; tone(660,n,.18,'sine',.08); tone(990,n+.09,.3,'sine',.08); },
  coin(i){ if(ctx) tone(1900+i*80, ctx.currentTime, .09, 'triangle', .05, 2700+i*80); },
  shutter(){
    if(!ctx) return; const n=ctx.currentTime;
    [0,.07].forEach((d,k)=>{
      const len=ctx.sampleRate*.05|0, b=ctx.createBuffer(1,len,ctx.sampleRate), x=b.getChannelData(0);
      for(let j=0;j<len;j++) x[j]=(Math.random()*2-1)*Math.pow(1-j/len,2);
      const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), v=ctx.createGain();
      s.buffer=b; f.type='highpass'; f.frequency.value=1800; v.gain.value=k?.25:.45;
      s.connect(f).connect(v).connect(master); s.start(n+d);
    });
  },
};
const PAD = [[130.81,261.63,329.63,392,493.88],[110,220,261.63,329.63,392],[87.31,174.61,220,261.63,349.23]];
function pad(){ // background chords, 4 s each, overlapped. Called from tick.
  if(!ctx || ctx.state!=='running' || padAt > ctx.currentTime+.3) return;
  const at=Math.max(padAt, ctx.currentTime+.05);
  PAD[padI++%PAD.length].forEach(f=>{
    const o=ctx.createOscillator(), v=ctx.createGain(); o.type='sine'; o.frequency.value=f;
    v.gain.setValueAtTime(0,at); v.gain.linearRampToValueAtTime(.016,at+1.4); v.gain.setValueAtTime(.016,at+3.4); v.gain.linearRampToValueAtTime(0,at+5);
    o.connect(v).connect(master); o.start(at); o.stop(at+5.1);
  });
  padAt = at+4;
}
function sound(){
  soundOn=!soundOn; const b=$('#snd'); b.textContent=soundOn?'Sound on':'Sound off'; b.classList.toggle('on',soundOn);
  if(master) master.gain.setTargetAtTime(soundOn?1:0, ctx.currentTime, .05);
}

const NS = 'http://www.w3.org/2000/svg', mk = $('#market');
function el(tag, attrs, parent=mk){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent.appendChild(e); return e; }
function curve(a, b, off, hubEnd, hubStart){
  const [ax,ay]=a, [bx,by]=b, dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
  const cut = hub => hub ? Math.min(100/Math.abs(ux||1e-6), 24/Math.abs(uy||1e-6))+8 : 56;
  const sx=ax+ux*cut(hubStart), sy=ay+uy*cut(hubStart), ex=bx-ux*(cut(hubEnd)+4), ey=by-uy*(cut(hubEnd)+4);
  const mx=(sx+ex)/2-uy*off, my=(sy+ey)/2+ux*off;
  return {d:`M${sx} ${sy}Q${mx} ${my} ${ex} ${ey}`, lx:.25*sx+.5*mx+.25*ex, ly:.25*sy+.5*my+.25*ey, ux, uy};
}

  if (!desk) phone(m.who, live ? 'idle' : m.screens[0][1], m.screens[0][2]);

  (c.taps||[]).forEach(([at,x,y])=>ev.push([at,()=>{
    if (!live) return desk || press('#pbtn', m.ok && (()=>ok(m.ok)));
    sfx.tap(); const r=document.createElement('div'); r.className='tap'; r.style.left=x+'%';
    r.style.top = desk ? y+'%' : `calc(30px + (100% - 30px) * ${y/100})`;

function clipTick(){
  if (!CLIP) return;

  while (CLIP.ev.length && CLIP.ev[0][0]<=ct) CLIP.ev.shift()[1]();
  if (CLIP.tick) CLIP.tick(ct);
  if (!v) return;
  if (ct<0){ if (!v.paused) v.pause(); return; }   // preroll: hold the first frame
  if (playing && ct<CLIP.dur){ if (Math.abs(v.currentTime-ct)>.25) v.currentTime=ct; if (v.paused) v.play().catch(()=>{}); }
  else {
    if (!v.paused) v.pause();

    if (ct>=CLIP.dur && !CLIP.held){ CLIP.held=true; v.currentTime=Math.max(0, Math.min(CLIP.dur, v.duration||CLIP.dur)-0.06); }
  }

function bez(k, u){

function archSteps(){

  const S = SUBS.S11.map(x=>x[0]*1000);

  // First pass: the dot reaches each step with the voice. Second pass: faster, all steps glow.
  const A=[S[1], S[2], (S[2]+S[3])/2, S[4], S[5], S[6], S[7], S[7]+1200, S[7]+2000];
  st.push([A[0],()=>{ dotAt(0); pop(0); }]);
  for (let k=1;k<9;k++){ const ms=Math.min(900, A[k]-A[k-1]-100); st.push([A[k]-ms,()=>hop(k-1,ms)], [A[k],()=>pop(k)]); }

  document.querySelectorAll('.hubedge').forEach(e=>e.classList.remove('paid'));
  document.querySelectorAll('.okb').forEach(e=>e.classList.remove('on'));
  panel(s.panel||'ledger');
  (s.paid||[]).forEach(paid);
  payin(s.payin||0);
  kpi('total','$'+total()); kpi('cancel','$'+(s.cancel||0)); kpi('move', s.move?'$'+s.move:'-'); kpi('saved', s.saved||'-');
  document.querySelectorAll('.kpi').forEach(k=>k.classList.remove('hot'));
  const b=$('#lbtn'); b.textContent = s.btn==='payout' ? 'Send payouts' : 'Run clearing'; b.disabled = !!s.btnOff;
  const ph = s.phone || [ACT.active,'idle'];
  // The phone belongs to a trader: with no trader at the stage, it stays out of the frame.
  if (s.swap) phoneSwap(ph[0], ph[1], ph[2]); else { $('#phone').classList.toggle('out', !ACT.active); phone(ph[0], ph[1], ph[2]); }
  focus(s.focus||null); bubble(null);
  subPlace(s.full || s.title ? 'full' : '');
  $('#titlecard').classList.toggle('on', !!s.title);
  $('#shot').className=''; $('#shot').style.transform='';
  document.querySelectorAll('.coin').forEach(c=>c.remove());
  $('#full').classList.toggle('on', !!s.full);
  [['openp','open'],['teamp','team'],['arch','arch'],['proof','proof'],['endp','end']].forEach(([id,k])=>$('#'+id).classList.toggle('on', s.full===k));
  $('#openp').classList.remove('rise','show'); $('#teamp').classList.remove('show');
  if (s.market==='draw') drawMarket();
  archReset();
  $('#proof').classList.remove('done'); $('#pnum').textContent='$'+DEBT_TOTAL; document.querySelectorAll('.tile').forEach(x=>x.classList.remove('on'));
}

/* Scene helpers */
const subSteps = key => VO[key].p.flatMap(([a,b],i)=>{ const next=VO[key].p[i+1];
  return [[a, ()=>sub(VO[key].t[i])], ...(!next || next[0]-b > 900 ? [[b+350, ()=>sub(null)]] : [])]; });
function circleSteps(i, T){
  const c=CIRCLES[i], keys=c.path.map((a,k)=>a+'>'+c.path[(k+1)%3]);
  return [
    [T, ()=>{ keys.forEach(k=>edge(k).classList.add('lit')); circleRow(i); count('cancel', CANCELLED[i], CANCELLED[i+1], 1200); sfx.tap(); }],
    [T+300, ()=>keys.forEach(k=>{ const from=AMT[k], to=from-c.v; AMT[k]=to; anim(1000, p=>EDGES[k].tx.textContent='$'+Math.round(from+(to-from)*p)); })],
    [T+1500, ()=>keys.forEach(k=>{ if(!AMT[k]) edge(k).classList.add('zero'); })],
    [T+1800, ()=>keys.forEach(k=>edge(k).classList.remove('lit'))],
  ];
}
// S05: 4 turns. Soa types at the desk, the others on the phone. Each turn: the phone (or desk) slides in, the clip plays with
// its typing card, the arrows appear at saved, the card holds 1.5 s (1.0 s in short mode), then the other side approves.
function weekSteps(dur){
  const st=[[0,()=>cam.classList.add('typing')]]; let T=0;
  WEEK.forEach((w,i)=>{
    const c=CLIPS[w.clip], desk=!!c.desk;
    if (i) st.push([T,()=>turn(w.who)]);
    if (desk) st.push([T,()=>deskOn(true)]);
    const C = T+(desk?1000:700), S = C + c.saved*1000, A = S + (c.short?700:900);
    st.push([C,()=>{ clip(w.clip); card(w); }],
      [S,()=>{ w.keys.forEach(k=>setEdge(k,1)); panel('ledger'); push(FEED[5][2*i]); }],
      [A,()=>{ const from=total(); w.keys.forEach(k=>setEdge(k,2)); panel('ledger'); approve(w.ok); count('total',from,total(),900); push(FEED[5][2*i+1]); }]);
    const end = Math.max(C + c.dur*1000, A, C + c.ready*1000 + 250*w.keys.length);
    if (desk) st.push([end,()=>deskOn(false)]);
    T = end;
  });
  st.push([T,()=>{ cardOff(); cam.classList.remove('typing'); }]);
  if (T > dur) console.warn(`S05: the turns need ${T} ms, the segment has ${dur} ms. Shorten the clips.`);
  return st;
}
// S09: 3 pay-ins. Soa's payment lands at the end of her phrase; Lalao and Fidy follow. Coins, the green hub arrow,
// the Paid row and the pay-in bar follow the clip's paid time.
function payInSteps(){
  const v=VO.S09.p, st=[], turns=[['soa','soaPay',`One payment of $${-NET.soa} and I am done.`],['lalao','lalaoPay',`$${-NET.lalao}, paid.`],['fidy','fidyPay',`$${-NET.fidy}, paid.`]];
  let T=0, sum=0, p=v[1][1]-300;
  turns.forEach(([id,name,say],i)=>{
    const c=CLIPS[name], s=(sum+=-NET[id]);
    if (i){ T=p+(i===1?1100:900); p=T+700+c.paid*1000; st.push([T,()=>turn(id)]); }
    const at=p-c.paid*1000;
    st.push([i ? p-400 : 200,()=>bubble(id, say)], [at,()=>clip(name)], [p,()=>{ coins(PHONE_PT, BAR_PT); sfx.chime(); }],
      [p+800,()=>{ paid(id); payin(s); push(FEED[9][i]); if(s===PAY_TOTAL) $('#lbtn').disabled=false; }]);
  });
  return st;
}
function notify(title, text){ $('#pnotif').innerHTML=`<small>${title}</small>${text}`; $('#pnotif').className='on'; sfx.chime(); }

const AFTER_CLEAR = {cancel:CANCELLED[3], move:PAY_TOTAL, saved:'67.7%', edges:'hub', panel:'plan', btn:'payout', btnOff:true};
const ALL = ['soa','lalao','fidy','hery','rivo'];
const V = k => VO[k].p;
// One scene per voice-over segment. Durations in ms, total 175 s.
const SCENES = [
  {key:'S00', label:'S00 Opening', dur:VO.S00.d, step:'Alamino', title:CONFIG.tagline, body:'Clearing for small businesses, with AI and PayPal.',
   setup(){ state({phone:[null,'idle'], full:'open'}); $('#feed').innerHTML=''; },

  {key:'S04', label:'S04 Market', dur:VO.S04.d, step:'The market', title:'Meet five traders',
   body:(s=>s[0].toUpperCase()+s.slice(1)+'.')(list(TRADERS.map(id=>'a '+CONFIG.people[id].job.toLowerCase()))),
   setup(){ state({phone:[null,'idle'], market:'draw', focus:'market'}); },
   steps:[]},
  {key:'S05', label:'S05 The week', dur:VO.S05.d, step:'The week', title:'Every trader puts debts into the app', body:'A desktop or a phone. A few words are enough. The other side approves each debt.',
   setup(){ state({active:'soa'}); },
   steps:weekSteps(VO.S05.d)},
  {key:'S06', label:'S06 Saturday', dur:VO.S06.d, step:'Saturday', title:`${N('rivo')} finds one more note`, body:`The AI reads the photo and drafts the debt. ${N('rivo')} checks it and saves.`,

   // "and saves" is 1.4 s into the last phrase: the Save tap of the clip (3.46 s) lands on it.
   steps:(v=>{ const C=v[4][0]+1400-3460; return [[v[0][0],()=>bubble('rivo',`I owe ${N('hery')} 50 for rice.`)],
     [v[1][0]-50,()=>{ focus('phone'); shotShow(); }],
     [v[2][1]-200,flash],

     [C+CLIPS.rivoAdd.saved*1000,()=>{ setEdge('rivo>hery',1); panel('ledger'); push(FEED[6][0]); focus(null); }]]; })(V('S06'))},
  {key:'S07', label:'S07 Confirm', dur:VO.S07.d, step:'Confirm', title:`${N('hery')} approves the debt`, body:'Both sides must agree before a debt counts in the round.',
   setup(){ state({active:'hery', edges:'proposed', swap:true}); },
   // The Approve tap of the clip (2.2 s) lands on "He approves". Until then the clip holds its first frame.
   steps:(v=>[[v[1][0],()=>bubble('hery',`Yes, ${N('rivo')} owes me 50.`)],
     [900,()=>clip('heryConfirm', v[2][0]+100-2200-900)],
     [v[2][0]+200,()=>{ setEdge('rivo>hery',2); count('total',WEEK_TOTAL,DEBT_TOTAL,900); panel('ledger'); push(FEED[7][0]); }],
     [v[2][1],()=>bubble(null)]])(V('S07'))},
  {key:'S08', label:'S08 Clear', dur:VO.S08.d, step:'Clear', title:`Circles of debt cancel $${CANCELLED[3]}`, body:'The clearing house runs a round. Plain code does every calculation, never the AI.',
   setup(){ state({ops:true, edges:'all'}); },
   // Circle 1 lights while the voice names it (Fidy, Rivo, Hery). Circles 2 and 3 and the hub follow "Three circles".
   steps:(v=>[[200,()=>bubble('ops','Time to clear the market.')],
     [500,()=>focus('laptop')],
     [v[1][0]+300,()=>press('#lbtn')],
     [v[1][0]+300,()=>bubble(null)],
     [v[1][1]-100,()=>{ focus('market'); panel('circles'); }],
     ...circleSteps(0,v[2][0]), ...circleSteps(1,v[3][0]), ...circleSteps(2,v[3][0]+1900),
     [v[3][0]+3700,()=>push(FEED[8][0])],
     [v[3][0]+3900,()=>{ mk.setAttribute('class','hub'); panel('plan'); count('move',0,PAY_TOTAL,1200); count('saved',0,67.7,1200,v=>v.toFixed(1)+'%');
       const b=$('#lbtn'); b.textContent='Send payouts'; b.disabled=true; }],
     [v[3][0]+4700,()=>push(FEED[8][1])]])(V('S08'))},
  {key:'S09', label:'S09 Pay in', dur:VO.S09.d, step:'Pay in', title:'Three traders pay what they still owe', body:`${list(['soa','lalao','fidy'].map(N))} pay $${PAY_TOTAL} in total into the clearing account through PayPal.`,
   setup(){ state({...AFTER_CLEAR, active:'soa', swap:true}); },
   steps:payInSteps()},
  {key:'S10', label:'S10 Pay out', dur:VO.S10.d, step:'Pay out', title:'PayPal pays the traders who are owed', body:`${N('hery')} gets $${NET.hery} and ${N('rivo')} gets $${NET.rivo}. Each trader gets a plain statement.`,
   setup(){ state({...AFTER_CLEAR, btnOff:false, ops:true, paid:['soa','lalao','fidy'], payin:PAY_TOTAL}); },
   // The statement holds its top ("You receive $290") while the voice names the payouts, then scrolls on "a plain statement".
   steps:(v=>[[900,()=>press('#lbtn')],
     [v[0][1]-700,()=>turn('hery')],
     [v[0][1]+300,()=>clip('heryStatement', v[2][0]-1400-(v[0][1]+300))],
     [v[1][0],()=>coins(LAPTOP_PT, PHONE_PT)],
     [v[1][0]+700,()=>notify('PayPal',`You received $${NET.hery}.00`)],
     [v[1][0]+900,()=>{ paid('hery'); push(FEED[10][0]); $('#lbtn').disabled=true; }],
     [v[1][0]+2950,()=>{ paid('rivo'); sfx.approve(); }],
     [v[1][1]+200,()=>bubble('hery',`My $${NET.hery} is in PayPal.`)]])(V('S10'))},
  {key:'S11', label:'S11 Architecture', dur:VO.S11.d, step:'How it works', title:'Four parts, one job each', body:'People decide. The AI reads and explains. Plain code counts. PayPal moves the money.',
   setup(){ state({...AFTER_CLEAR, paid:ALL, payin:PAY_TOTAL, full:'arch'}); },
   steps:archSteps()},
  {key:'S12', label:'S12 Proof', dur:VO.S12.d, step:'Proof', title:`$${DEBT_TOTAL} of debt settled with $${PAY_TOTAL}`, body:'Real PayPal payments. Every journey is tested.',
   setup(){ state({...AFTER_CLEAR, paid:ALL, payin:PAY_TOTAL, full:'proof'}); },
   // $990 shows on "$990 of debt", counts down on "$320 actually moved"; each tile lands on its phrase.
   steps:(v=>[[v[2][0],()=>anim(1500, k=>$('#pnum').textContent='$'+Math.round(DEBT_TOTAL-(DEBT_TOTAL-PAY_TOTAL)*k))],
     [v[2][1]-200,()=>{ $('#proof').classList.add('done'); sfx.chime(); }],
     ...[v[2][1]+350, v[3][0]+300, v[4][0]+200, v[5][0]+600].map((ms,i)=>[ms,()=>{ document.querySelectorAll('.tile')[i].classList.add('on'); sfx.approve(); }])])(V('S12'))},
  {key:'S13', label:'S13 End', dur:VO.S13.d, step:'Alamino', title:CONFIG.tagline, body:'Try it live. The code is open on GitHub.',
   setup(){ state({...AFTER_CLEAR, paid:ALL, payin:PAY_TOTAL, full:'end'}); },
   steps:[[300,()=>$('#endp').classList.add('on')]]},
];
SCENES.forEach(s=>{ s.steps = [...s.steps, ...subSteps(s.key)].sort((a,b)=>a[0]-b[0]); });

/* Timeline */
let cur=0, t=0, fired=0, playing=true, last=performance.now();
const ctrl = $('#ctrl');
ctrl.innerHTML = `<button id="play">Pause</button><button id="snd" class="on">Sound on</button>` + SCENES.map((s,i)=>`<button data-i="${i}">${s.label}</button>`).join('') +
  `<span class="hint">Click once to start the sound. Space: play or pause. Arrows: scenes. H: hide this bar for recording.</span>`;
$('#dots').innerHTML = SCENES.map(()=>'<i></i>').join('');
function go(i){
  gen++; REC.scenes.push([i, Date.now()]);
  cur=(i+SCENES.length)%SCENES.length; t=0; fired=0;
  const s=SCENES[cur];
  // Rebuild the feed for the scenes before this one
  if (cur>0){ $('#feed').innerHTML=''; FEED.slice(0,cur).flat().forEach(push); }
  s.setup();
  const cap=$('#caption'); cap.querySelector('.step').textContent=s.step; cap.querySelector('h2').textContent=s.title; cap.querySelector('p').textContent=s.body;
  cap.classList.remove('swap'); void cap.offsetWidth; cap.classList.add('swap');
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k<=cur));
  ctrl.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur));
}
function setPlaying(p){ playing=p; $('#play').textContent=p?'Pause':'Play'; if(ctx) p ? ctx.resume() : ctx.suspend(); }
function tick(now){
  const dt=now-last; last=now;
  if(playing){
    t+=dt; const s=SCENES[cur];
    while(fired<s.steps.length && s.steps[fired][0]<=t) s.steps[fired++][1]();
    // The last scene holds its end state: no loop.
    if(t>=s.dur){ if(cur===SCENES.length-1) setPlaying(false); else { const over=t-s.dur; go(cur+1); t=over; } }
  }
  clipTick(); pad();
  const total=SCENES.reduce((a,s)=>a+s.dur,0), done=SCENES.slice(0,cur).reduce((a,s)=>a+s.dur,0)+Math.min(t,SCENES[cur].dur);
  $('#progress').style.width=(done/total*100)+'%';
  requestAnimationFrame(tick);
}
function toggle(){ if(!playing && cur===SCENES.length-1 && t>=SCENES[cur].dur) go(0); setPlaying(!playing); }
addEventListener('pointerdown', audio, true);
ctrl.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='play') toggle(); else if(b.id==='snd') sound(); else { go(+b.dataset.i); setPlaying(true); }
});
addEventListener('keydown',e=>{
  audio();
  if(e.key===' '){ e.preventDefault(); toggle(); }
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
  if(e.key==='h'||e.key==='H'){ document.body.classList.toggle('clean'); fit(); }
});
function fit(){
  const top = document.body.classList.contains('clean') ? 0 : 52;
  const s = Math.min(innerWidth/1920, (innerHeight-top)/1080);
  frame.style.transform = `translate(${(innerWidth-1920*s)/2}px,${top+(innerHeight-top-1080*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit); fit();
const q = new URLSearchParams(location.search);
// ?rec: the page waits for window.__start() (the recorder calls it when the clips are loaded) and logs the sound effects.
const REC = {scenes:[], sfx:[], t0:0};
window.__rec = REC;
Object.keys(sfx).forEach(k=>{ const f=sfx[k]; sfx[k]=(...a)=>{ REC.sfx.push([Date.now(), k, a[0]??0]); return f(...a); }; });
if (q.has('rec')) { playing=false; window.__start=()=>{ REC.scenes.length=0; REC.sfx.length=0; REC.t0=Date.now(); go(0); last=performance.now(); playing=true; }; }
if (q.has('clean')) { document.body.classList.add('clean'); fit(); }
// First placement without transitions, so figures do not fly in from the corner
frame.classList.add('notrans');
go(+(q.get('scene')||0));
requestAnimationFrame(()=>requestAnimationFrame(()=>frame.classList.remove('notrans')));
requestAnimationFrame(tick);
</script>
